# ZRH - Hand off with brief
# Replaces the body of your Escalate system topic (or call it from any topic that must hand off).
#
# With generative orchestration ON, the orchestrator fills the inputs below from the conversation
# history, so the summary, sentiment and suggested opener cost no extra plumbing.
# With classic orchestration, set Global.zrh_Reason, zrh_Goal, zrh_Summary, zrh_Escalation,
# zrh_Sentiment, zrh_Urgency, zrh_NextStep and zrh_Opener in your topics instead (see the demo topic).
# Facts, tried steps and verification come from the helper topics (deterministic, never invented).
#
# It writes ONE global variable, Global.zrh_HandoffBrief (schema: /schema/handoff-brief.schema.json),
# which Copilot Studio passes to Dynamics 365 as a context variable on transfer.
# Limits: 4,000 characters per context variable value, 28 KB for all variables together.
# Over 28 KB the transfer still happens but WITHOUT any variables, so this topic shrinks the brief
# and clears the working variables before transferring.
kind: AdaptiveDialog
inputs:
  - kind: AutomaticTaskInput
    propertyName: Reason
    description: In one line, why the customer contacted us, in their terms. Example "Password reset link never arrived".
    entity: StringPrebuiltEntity
    shouldPromptUser: false

  - kind: AutomaticTaskInput
    propertyName: Goal
    description: In one line, what the customer wants to end up with.
    entity: StringPrebuiltEntity
    shouldPromptUser: false

  - kind: AutomaticTaskInput
    propertyName: Summary
    description: Two or three factual sentences on the conversation so far, for the human representative. No greetings.
    entity: StringPrebuiltEntity
    shouldPromptUser: false

  - kind: AutomaticTaskInput
    propertyName: Escalation
    description: Why we are handing off. Exactly one of customer_request, policy, unresolved, sentiment, authentication, high_value, other.
    entity: StringPrebuiltEntity
    shouldPromptUser: false

  - kind: AutomaticTaskInput
    propertyName: Sentiment
    description: The customer's current mood. Exactly one of positive, neutral, negative.
    entity: StringPrebuiltEntity
    shouldPromptUser: false

  - kind: AutomaticTaskInput
    propertyName: Urgency
    description: How urgent the issue is for the customer. Exactly one of low, medium, high.
    entity: StringPrebuiltEntity
    shouldPromptUser: false

  - kind: AutomaticTaskInput
    propertyName: NextStep
    description: The most useful next step for the human representative, in one sentence.
    entity: StringPrebuiltEntity
    shouldPromptUser: false

  - kind: AutomaticTaskInput
    propertyName: Opener
    description: A first message the representative can send that addresses the customer by name if known and proves we know what already happened. Never ask for information the customer already gave.
    entity: StringPrebuiltEntity
    shouldPromptUser: false

modelDescription: Hands the conversation to a human representative with a brief of everything the customer already said and what was already tried. Use when the customer asks for a person, when the issue can't be resolved, when policy requires a person, or when the customer is upset.
beginDialog:
  # Triggered by the orchestrator from modelDescription (so it can fill the inputs from the conversation),
  # and also reachable by redirect from the Escalate system topic (inputs then fall back to defaults).
  kind: OnRecognizedIntent
  id: main
  intent: {}
  actions:
    # 0. Without generative orchestration (or when reached by redirect) the inputs are empty:
    #    fall back to Global.zrh_* values your own topics set along the way.
    - kind: SetVariable
      id: zrhResolveReason
      variable: Topic.Reason
      value: =Coalesce(Topic.Reason, Global.zrh_Reason)

    - kind: SetVariable
      id: zrhResolveGoal
      variable: Topic.Goal
      value: =Coalesce(Topic.Goal, Global.zrh_Goal)

    - kind: SetVariable
      id: zrhResolveSummary
      variable: Topic.Summary
      value: =Coalesce(Topic.Summary, Global.zrh_Summary)

    - kind: SetVariable
      id: zrhResolveEscalation
      variable: Topic.Escalation
      value: =Coalesce(Topic.Escalation, Global.zrh_Escalation, "customer_request")

    - kind: SetVariable
      id: zrhResolveSentiment
      variable: Topic.Sentiment
      value: =Coalesce(Topic.Sentiment, Global.zrh_Sentiment)

    - kind: SetVariable
      id: zrhResolveUrgency
      variable: Topic.Urgency
      value: =Coalesce(Topic.Urgency, Global.zrh_Urgency)

    - kind: SetVariable
      id: zrhResolveNext
      variable: Topic.NextStep
      value: =Coalesce(Topic.NextStep, Global.zrh_NextStep)

    - kind: SetVariable
      id: zrhResolveOpener
      variable: Topic.Opener
      value: =Coalesce(Topic.Opener, Global.zrh_Opener)

    # Gotcha: a variable whose text starts with "{" fails with SystemError when a topic reads it back.
    # So the pieces below never start with "{" — the outer braces are added only in the final assignment.

    # 1. Common parts reused by the full and the compact brief (leading "~" is stripped at the end).
    - kind: SetVariable
      id: zrhHead
      variable: Topic.Head
      value: |-
        ="~""v"":1,""reason"":" & JSON(Left(Coalesce(Topic.Reason, "Escalated by the AI agent"), 160)) &
        If(IsBlank(Global.zrh_VerifiedStatus), "",
            ",""verified"":{""status"":" & JSON(Global.zrh_VerifiedStatus) &
            ",""method"":" & JSON(Coalesce(Global.zrh_VerifiedMethod, "")) &
            ",""at"":" & JSON(Coalesce(Global.zrh_VerifiedAt, "")) & "}") &
        ",""facts"":[" & Mid(Coalesce(Global.zrh_FactsJson, ","), 2) & "]" &
        If(IsBlank(Topic.Opener), "", ",""opener"":" & JSON(Left(Topic.Opener, 300)))

    # 2. Full brief body.
    - kind: SetVariable
      id: zrhFull
      variable: Topic.Body
      value: |-
        =Topic.Head &
        If(IsBlank(Topic.Goal), "", ",""goal"":" & JSON(Left(Topic.Goal, 160))) &
        If(IsBlank(Topic.Summary), "", ",""summary"":" & JSON(Left(Topic.Summary, 400))) &
        If(Lower(Topic.Escalation) in ["customer_request", "policy", "unresolved", "sentiment", "authentication", "high_value", "other"], ",""escalation"":" & JSON(Lower(Topic.Escalation)), "") &
        If(Lower(Topic.Sentiment) in ["positive", "neutral", "negative"], ",""sentiment"":" & JSON(Lower(Topic.Sentiment)), "") &
        If(Lower(Topic.Urgency) in ["low", "medium", "high"], ",""urgency"":" & JSON(Lower(Topic.Urgency)), "") &
        If(IsBlank(Topic.NextStep), "", ",""next"":" & JSON(Left(Topic.NextStep, 200))) &
        ",""tried"":[" & Mid(Coalesce(Global.zrh_TriedJson, ","), 2) & "]"

    # 3. Size guard: Dynamics 365 caps one context variable value at 4,000 characters.
    - kind: ConditionGroup
      id: zrhSizeGuard
      conditions:
        - id: zrhTooBig
          condition: =Len(Topic.Body) > 3900
          actions:
            - kind: SetVariable
              id: zrhCompact
              variable: Topic.Body
              value: =Topic.Head

            - kind: ConditionGroup
              id: zrhStillTooBig
              conditions:
                - id: zrhStillTooBigYes
                  condition: =Len(Topic.Body) > 3900
                  actions:
                    - kind: SetVariable
                      id: zrhMinimal
                      variable: Topic.Body
                      value: ="~""v"":1,""reason"":" & JSON(Left(Coalesce(Topic.Reason, "Escalated by the AI agent"), 160))

    - kind: SetVariable
      id: zrhBrief
      variable: Global.zrh_HandoffBrief
      value: ="{" & Mid(Topic.Body, 2) & "}"

    # 4. Private message for the representative (becomes va_AgentMessage).
    - kind: SetVariable
      id: zrhAgentMessage
      variable: Topic.AgentMessage
      value: =Left(Coalesce(Topic.Summary, Topic.Reason, "Escalated by the AI agent"), 400)

    # 5. Clear every working variable. On transfer Copilot Studio sends ALL global AND topic variables,
    #    so without this the brief travels three times toward the 28 KB limit.
    - kind: SetVariable
      id: zrhClearHead
      variable: Topic.Head
      value: =""

    - kind: SetVariable
      id: zrhClearBody
      variable: Topic.Body
      value: =""

    - kind: SetVariable
      id: zrhClearReason
      variable: Topic.Reason
      value: =""

    - kind: SetVariable
      id: zrhClearGoal
      variable: Topic.Goal
      value: =""

    - kind: SetVariable
      id: zrhClearSummary
      variable: Topic.Summary
      value: =""

    - kind: SetVariable
      id: zrhClearEscalation
      variable: Topic.Escalation
      value: =""

    - kind: SetVariable
      id: zrhClearSentiment
      variable: Topic.Sentiment
      value: =""

    - kind: SetVariable
      id: zrhClearUrgency
      variable: Topic.Urgency
      value: =""

    - kind: SetVariable
      id: zrhClearNext
      variable: Topic.NextStep
      value: =""

    - kind: SetVariable
      id: zrhClearOpener
      variable: Topic.Opener
      value: =""

    - kind: SetVariable
      id: zrhClearFacts
      variable: Global.zrh_FactsJson
      value: =""

    - kind: SetVariable
      id: zrhClearTried
      variable: Global.zrh_TriedJson
      value: =""

    - kind: SetVariable
      id: zrhClearVerified
      variable: Global.zrh_VerifiedStatus
      value: =""

    - kind: SetVariable
      id: zrhClearVerifiedMethod
      variable: Global.zrh_VerifiedMethod
      value: =""

    - kind: SetVariable
      id: zrhClearVerifiedAt
      variable: Global.zrh_VerifiedAt
      value: =""

    - kind: SetVariable
      id: zrhClearGReason
      variable: Global.zrh_Reason
      value: =""

    - kind: SetVariable
      id: zrhClearGGoal
      variable: Global.zrh_Goal
      value: =""

    - kind: SetVariable
      id: zrhClearGSummary
      variable: Global.zrh_Summary
      value: =""

    - kind: SetVariable
      id: zrhClearGEscalation
      variable: Global.zrh_Escalation
      value: =""

    - kind: SetVariable
      id: zrhClearGSentiment
      variable: Global.zrh_Sentiment
      value: =""

    - kind: SetVariable
      id: zrhClearGUrgency
      variable: Global.zrh_Urgency
      value: =""

    - kind: SetVariable
      id: zrhClearGNext
      variable: Global.zrh_NextStep
      value: =""

    - kind: SetVariable
      id: zrhClearGOpener
      variable: Global.zrh_Opener
      value: =""

    - kind: SendActivity
      id: zrhTellCustomer
      activity: I'm connecting you with a colleague now. They'll see everything we've covered, so you won't need to repeat yourself.

    # 6. Transfer. messageToAgent is a message template, not a formula: interpolate with {...}.
    - kind: TransferConversationV2
      id: zrhTransfer
      transferType:
        kind: TransferToAgent
        messageToAgent: "{Topic.AgentMessage}"

inputType:
  properties:
    Reason:
      displayName: Reason
      type: String

    Goal:
      displayName: Goal
      type: String

    Summary:
      displayName: Summary
      type: String

    Escalation:
      displayName: Escalation
      type: String

    Sentiment:
      displayName: Sentiment
      type: String

    Urgency:
      displayName: Urgency
      type: String

    NextStep:
      displayName: NextStep
      type: String

    Opener:
      displayName: Opener
      type: String

outputType: {}
