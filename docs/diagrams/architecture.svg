<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1600" height="960" fill="#ffffff"/>
  <text x="60" y="70" font-size="34" font-weight="700" fill="#0f172a">Zero-Repeat Handoff — architecture</text>
  <text x="60" y="108" font-size="20" fill="#475569">Copilot Studio writes a brief, Dynamics 365 carries it, the representative sees it, and every handoff gets a score.</text>

  <!-- Customer -->
  <rect x="60" y="190" width="230" height="250" rx="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="175" y="235" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">Customer</text>
  <text x="175" y="268" font-size="17" fill="#475569" text-anchor="middle">Live chat widget</text>
  <rect x="85" y="300" width="180" height="110" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="175" y="335" font-size="15" fill="#334155" text-anchor="middle">"I can't log in, the</text>
  <text x="175" y="357" font-size="15" fill="#334155" text-anchor="middle">reset email never</text>
  <text x="175" y="379" font-size="15" fill="#334155" text-anchor="middle">comes"</text>

  <!-- Copilot Studio -->
  <rect x="360" y="150" width="380" height="470" rx="18" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="550" y="195" font-size="22" font-weight="700" fill="#312e81" text-anchor="middle">Copilot Studio agent</text>
  <text x="550" y="223" font-size="16" fill="#4338ca" text-anchor="middle">standard harness · classic or generative</text>
  <g font-size="17" fill="#1e1b4b">
    <rect x="390" y="248" width="320" height="50" rx="10" fill="#ffffff" stroke="#a5b4fc"/>
    <text x="410" y="280">ZRH - Remember fact  <tspan fill="#6366f1">(email, order #)</tspan></text>
    <rect x="390" y="310" width="320" height="50" rx="10" fill="#ffffff" stroke="#a5b4fc"/>
    <text x="410" y="342">ZRH - Mark verified  <tspan fill="#6366f1">(email code)</tspan></text>
    <rect x="390" y="372" width="320" height="50" rx="10" fill="#ffffff" stroke="#a5b4fc"/>
    <text x="410" y="404">ZRH - Log step  <tspan fill="#6366f1">(reset link: failed)</tspan></text>
    <rect x="390" y="434" width="320" height="56" rx="10" fill="#6366f1"/>
    <text x="410" y="469" fill="#ffffff" font-weight="600">ZRH - Hand off with brief</text>
  </g>
  <rect x="390" y="510" width="320" height="86" rx="10" fill="#1e1b4b"/>
  <text x="410" y="542" font-size="16" fill="#c7d2fe" font-family="Consolas, monospace">Global.zrh_HandoffBrief</text>
  <text x="410" y="568" font-size="15" fill="#e0e7ff">one JSON brief · ≤ 4,000 chars</text>
  <text x="410" y="588" font-size="15" fill="#e0e7ff">working variables cleared (28 KB)</text>

  <!-- Dynamics 365 Contact Center -->
  <rect x="810" y="150" width="360" height="470" rx="18" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="990" y="195" font-size="22" font-weight="700" fill="#164e63" text-anchor="middle">Dynamics 365 Contact Center</text>
  <g font-size="16" fill="#164e63">
    <rect x="840" y="225" width="300" height="56" rx="10" fill="#ffffff" stroke="#67e8f9"/>
    <text x="860" y="259">Unified routing → queue</text>
    <rect x="840" y="295" width="300" height="56" rx="10" fill="#ffffff" stroke="#67e8f9"/>
    <text x="860" y="321">Conversation</text>
    <text x="860" y="341" font-size="13" fill="#0e7490" font-family="Consolas, monospace">msdyn_ocliveworkitem</text>
    <rect x="840" y="365" width="300" height="70" rx="10" fill="#cffafe" stroke="#0891b2"/>
    <text x="860" y="393">Context items (incl. the brief)</text>
    <text x="860" y="417" font-size="13" fill="#0e7490" font-family="Consolas, monospace">msdyn_ocliveworkitemcontextitem</text>
    <rect x="840" y="449" width="300" height="70" rx="10" fill="#ffffff" stroke="#67e8f9"/>
    <text x="860" y="477">Saved transcript (on close)</text>
    <text x="860" y="501" font-size="13" fill="#0e7490" font-family="Consolas, monospace">msdyn_transcript + annotation</text>
  </g>

  <!-- Copilot Service workspace -->
  <rect x="1240" y="150" width="300" height="470" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1390" y="195" font-size="22" font-weight="700" fill="#14532d" text-anchor="middle">Copilot Service</text>
  <text x="1390" y="222" font-size="22" font-weight="700" fill="#14532d" text-anchor="middle">workspace</text>
  <rect x="1265" y="245" width="250" height="345" rx="12" fill="#ffffff" stroke="#86efac"/>
  <text x="1285" y="278" font-size="18" font-weight="700" fill="#14532d">Handoff Brief Card</text>
  <text x="1285" y="300" font-size="14" fill="#16a34a">PCF · React · Fluent UI v9</text>
  <g font-size="15" fill="#14532d">
    <rect x="1285" y="318" width="132" height="26" rx="13" fill="#16a34a"/>
    <text x="1297" y="336" fill="#ffffff" font-size="14">Identity verified</text>
    <text x="1285" y="374">• Reason &amp; goal</text>
    <text x="1285" y="402">• Copy opener</text>
    <text x="1285" y="430">• Don't ask again:</text>
    <text x="1302" y="452" font-size="14" fill="#166534">email, order number</text>
    <text x="1285" y="480">• Already tried</text>
    <text x="1285" y="508">• Next step</text>
    <text x="1285" y="536">• Re-ask warning</text>
    <text x="1302" y="558" font-size="13" fill="#166534">(where the live table fills)</text>
  </g>

  <!-- Arrows top row -->
  <line x1="290" y1="315" x2="355" y2="315" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
  <text x="322" y="300" font-size="14" fill="#475569" text-anchor="middle">chat</text>
  <line x1="740" y1="470" x2="805" y2="470" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
  <text x="772" y="440" font-size="14" fill="#475569" text-anchor="middle">transfer +</text>
  <text x="772" y="456" font-size="14" fill="#475569" text-anchor="middle">variables</text>
  <line x1="1170" y1="253" x2="1235" y2="253" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
  <text x="1202" y="240" font-size="14" fill="#475569" text-anchor="middle">route</text>
  <line x1="1140" y1="400" x2="1260" y2="400" stroke="#16a34a" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/>
  <text x="1200" y="388" font-size="14" fill="#16a34a" text-anchor="middle">reads</text>

  <!-- Measurement row -->
  <rect x="810" y="700" width="360" height="110" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="990" y="742" font-size="20" font-weight="700" fill="#7c2d12" text-anchor="middle">score-conversations.mjs</text>
  <text x="990" y="772" font-size="15" fill="#9a3412" text-anchor="middle">re-asked facts · generic opener ·</text>
  <text x="990" y="794" font-size="15" fill="#9a3412" text-anchor="middle">"I already told the bot"</text>
  <rect x="1240" y="700" width="300" height="110" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="1390" y="742" font-size="20" font-weight="700" fill="#7c2d12" text-anchor="middle">Handoff Quality</text>
  <text x="1390" y="770" font-size="13" fill="#9a3412" text-anchor="middle" font-family="Consolas, monospace">zrh_handoffquality</text>
  <text x="1390" y="794" font-size="15" fill="#9a3412" text-anchor="middle">one score (0–100) per handoff</text>
  <line x1="990" y1="520" x2="990" y2="695" stroke="#ea580c" stroke-width="3" marker-end="url(#a)"/>
  <text x="1000" y="650" font-size="14" fill="#ea580c">transcript + brief</text>
  <line x1="1170" y1="755" x2="1235" y2="755" stroke="#ea580c" stroke-width="3" marker-end="url(#a)"/>

  <text x="60" y="900" font-size="16" fill="#64748b">github.com/bonaniibm/zero-repeat-handoff · MIT</text>
</svg>
