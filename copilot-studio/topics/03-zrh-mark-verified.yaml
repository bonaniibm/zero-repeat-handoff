# ZRH - Mark verified
# Call this right after the agent verifies the customer's identity (signed-in chat, email code, SMS code...).
# The representative then sees "Identity verified" with the method and time, and doesn't re-verify.
kind: AdaptiveDialog
inputs:
  - kind: AutomaticTaskInput
    propertyName: Method
    description: How the customer was verified, for example "Email one-time code".
    entity: StringPrebuiltEntity
    shouldPromptUser: false

  - kind: AutomaticTaskInput
    propertyName: Status
    description: verified, partial or none.
    entity: StringPrebuiltEntity
    shouldPromptUser: false

modelDescription: Internal helper. Records that the customer's identity was verified and how. Do not trigger from user messages.
beginDialog:
  kind: OnRedirect
  id: main
  actions:
    # Plain values; the hand-off topic turns them into the "verified" object.
    - kind: SetVariable
      id: zrhSetVerifiedStatus
      variable: Global.zrh_VerifiedStatus
      value: =If(Lower(Topic.Status) in ["verified", "partial", "none"], Lower(Topic.Status), "verified")

    - kind: SetVariable
      id: zrhSetVerifiedMethod
      variable: Global.zrh_VerifiedMethod
      value: =Left(Coalesce(Topic.Method, "Verified by the AI agent"), 60)

    - kind: SetVariable
      id: zrhSetVerifiedAt
      variable: Global.zrh_VerifiedAt
      value: =Text(Now(), DateTimeFormat.UTC)

inputType:
  properties:
    Method:
      displayName: Method
      type: String

    Status:
      displayName: Status
      type: String

outputType: {}
