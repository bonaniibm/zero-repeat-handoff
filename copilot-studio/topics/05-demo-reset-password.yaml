# Demo: Reset password (Contoso)
# A small, self-contained scenario that exercises every helper so you can record the before/after demo.
# Nothing is really sent: the "code" is shown on screen.
#
# Before pasting, replace every "zrh_agent" with your agent's schema name
# (Copilot Studio > Settings > Advanced > Metadata > Schema name), e.g. cr6b2_contosoSupport.
kind: AdaptiveDialog
modelDescription: Helps a customer who can't sign in or whose password reset email didn't arrive.
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Reset password (demo)
    triggerQueries:
      - I can't log in
      - reset my password
      - the reset email never arrives
      - forgot password
      - locked out of my account

  actions:
    - kind: Question
      id: askEmail
      variable: init:Topic.Email
      prompt: Sorry you're locked out. What's the email address on your account?
      entity: EmailPrebuiltEntity

    - kind: BeginDialog
      id: rememberEmail
      input:
        binding:
          Label: ="Email"
          Value: =Topic.Email
      dialog: zrh_agent.topic.ZRHRememberFact

    - kind: SendActivity
      id: sentCode
      activity: I've sent a 6-digit code to {Topic.Email}. (Demo only - the code is 482913.)

    - kind: Question
      id: askCode
      variable: init:Topic.Code
      prompt: What's the code?
      entity: StringPrebuiltEntity

    - kind: ConditionGroup
      id: checkCode
      conditions:
        - id: codeOk
          condition: =Trim(Topic.Code) = "482913"
          actions:
            - kind: BeginDialog
              id: markVerified
              input:
                binding:
                  Method: ="Email one-time code"
                  Status: ="verified"
              dialog: zrh_agent.topic.ZRHMarkVerified

            - kind: SendActivity
              id: verifiedMsg
              activity: Thanks, you're verified.

      elseActions:
        - kind: BeginDialog
          id: logCodeFailed
          input:
            binding:
              Step: ="Verified identity by email code"
              Outcome: ="failed"
              Note: ="Code didn't match"
          dialog: zrh_agent.topic.ZRHLogStep

    - kind: Question
      id: askOrder
      variable: init:Topic.OrderNumber
      prompt: Is there an order waiting on this? If so, what's the order number? (Say "none" if not.)
      entity: StringPrebuiltEntity

    - kind: ConditionGroup
      id: hasOrder
      conditions:
        - id: hasOrderYes
          condition: =!(Lower(Trim(Topic.OrderNumber)) in ["none", "no", "n/a", "na"])
          actions:
            - kind: BeginDialog
              id: rememberOrder
              input:
                binding:
                  Label: ="Order number"
                  Value: =Upper(Trim(Topic.OrderNumber))
              dialog: zrh_agent.topic.ZRHRememberFact

    - kind: SendActivity
      id: sentLink
      activity: I've sent a password reset link to {Topic.Email}. It usually arrives within a minute.

    - kind: Question
      id: askArrived
      variable: init:Topic.Arrived
      prompt: Did the reset email arrive? Please check your spam folder too.
      entity: BooleanPrebuiltEntity

    - kind: ConditionGroup
      id: arrived
      conditions:
        - id: arrivedYes
          condition: =Topic.Arrived = true
          actions:
            - kind: BeginDialog
              id: logLinkOk
              input:
                binding:
                  Step: ="Sent password reset link"
                  Outcome: ="succeeded"
              dialog: zrh_agent.topic.ZRHLogStep

            - kind: SendActivity
              id: done
              activity: Great - follow the link to choose a new password. Anything else?

      elseActions:
        - kind: BeginDialog
          id: logLinkFailed
          input:
            binding:
              Step: ="Sent password reset link"
              Outcome: ="failed"
              Note: ="Customer says it didn't arrive (checked spam)"
          dialog: zrh_agent.topic.ZRHLogStep

        # Narrative for the brief. With generative orchestration on, the hand-off topic writes these itself.
        - kind: SetVariable
          id: setReason
          variable: Global.zrh_Reason
          value: ="Password reset link never arrived"

        - kind: SetVariable
          id: setGoal
          variable: Global.zrh_Goal
          value: ="Get back into the account"

        - kind: SetVariable
          id: setEscalation
          variable: Global.zrh_Escalation
          value: ="unresolved"

        - kind: SetVariable
          id: setSentiment
          variable: Global.zrh_Sentiment
          value: ="negative"

        - kind: SetVariable
          id: setUrgency
          variable: Global.zrh_Urgency
          value: =If(Lower(Trim(Topic.OrderNumber)) in ["none", "no", "n/a", "na"], "medium", "high")

        - kind: SetVariable
          id: setNext
          variable: Global.zrh_NextStep
          value: ="Check the mail log for bounces, then reset the password manually and send a temporary code by SMS."

        - kind: SetVariable
          id: setSummary
          variable: Global.zrh_Summary
          value: ="The customer can't sign in. The AI agent verified them by email code and sent a reset link to " & Topic.Email & ", which didn't arrive (spam checked)."

        - kind: SetVariable
          id: setOpener
          variable: Global.zrh_Opener
          value: |-
            ="Hi, I can see the reset link to " & Topic.Email & " didn't arrive" &
            If(Lower(Trim(Topic.OrderNumber)) in ["none", "no", "n/a", "na"], "", " and that order " & Upper(Trim(Topic.OrderNumber)) & " is waiting") &
            ". Let me sort out your access right now."

        - kind: SendActivity
          id: offerHuman
          activity: Sorry about that. A colleague can reset it manually - just say "talk to a person" and I'll connect you.
