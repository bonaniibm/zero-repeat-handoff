<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1600" height="1040" fill="#ffffff"/>
  <text x="60" y="66" font-size="34" font-weight="700" fill="#0f172a">One handoff, step by step</text>
  <text x="60" y="102" font-size="20" fill="#475569">Recorded live: the customer never repeats the email, the order number or what already failed.</text>

  <!-- Lifelines -->
  <g font-size="19" font-weight="700" text-anchor="middle">
    <rect x="110" y="135" width="220" height="56" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="220" y="170" fill="#0f172a">Customer</text>
    <rect x="490" y="135" width="260" height="56" rx="12" fill="#eef2ff" stroke="#6366f1"/>
    <text x="620" y="170" fill="#312e81">Copilot Studio agent</text>
    <rect x="880" y="135" width="280" height="56" rx="12" fill="#ecfeff" stroke="#0891b2"/>
    <text x="1020" y="170" fill="#164e63">D365 Contact Center</text>
    <rect x="1270" y="135" width="260" height="56" rx="12" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="1400" y="170" fill="#14532d">Representative + card</text>
  </g>
  <g stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6">
    <line x1="220" y1="191" x2="220" y2="1000"/>
    <line x1="620" y1="191" x2="620" y2="1000"/>
    <line x1="1020" y1="191" x2="1020" y2="1000"/>
    <line x1="1400" y1="191" x2="1400" y2="1000"/>
  </g>

  <g font-size="17" fill="#0f172a">
    <!-- 1 -->
    <line x1="225" y1="250" x2="612" y2="250" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="240" y="238">"I can't log in, the reset email never comes"</text>

    <!-- 2 -->
    <rect x="640" y="275" width="330" height="100" rx="10" fill="#eef2ff" stroke="#a5b4fc"/>
    <text x="655" y="303" font-weight="600" fill="#312e81">Remember fact: Email</text>
    <text x="655" y="328" font-weight="600" fill="#312e81">Mark verified: email code</text>
    <text x="655" y="353" font-weight="600" fill="#312e81">Remember fact: Order ORD-10482</text>

    <!-- 3 -->
    <rect x="640" y="390" width="330" height="44" rx="10" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="655" y="419" font-weight="600" fill="#991b1b">Log step: reset link → failed</text>

    <!-- 4 -->
    <line x1="225" y1="475" x2="612" y2="475" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="240" y="463">"Talk to a person"</text>

    <!-- 5 -->
    <rect x="640" y="495" width="330" height="70" rx="10" fill="#6366f1"/>
    <text x="655" y="523" font-weight="600" fill="#ffffff">Hand off with brief</text>
    <text x="655" y="549" font-size="15" fill="#e0e7ff">build zrh_HandoffBrief · clear temp vars</text>

    <!-- 6 -->
    <line x1="625" y1="610" x2="1012" y2="610" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="640" y="598">Transfer conversation + zrh_HandoffBrief</text>

    <!-- 7 -->
    <line x1="1025" y1="670" x2="1392" y2="670" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="1040" y="658">Route · representative accepts</text>

    <!-- 8 -->
    <line x1="1395" y1="725" x2="1028" y2="725" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#a)"/>
    <text x="1040" y="713" fill="#166534">Card reads the conversation's context items</text>

    <!-- 9 -->
    <rect x="1180" y="745" width="390" height="92" rx="10" fill="#f0fdf4" stroke="#86efac"/>
    <text x="1195" y="773" font-weight="600" fill="#14532d">Copy opener →</text>
    <text x="1195" y="798" font-size="15" fill="#166534">"I can see the reset link didn't arrive and</text>
    <text x="1195" y="820" font-size="15" fill="#166534">that order ORD-10482 is waiting…"</text>
    <line x1="1392" y1="870" x2="228" y2="870" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="240" y="858" fill="#166534" font-weight="600">First reply proves we listened — no "How can I help you today?"</text>

    <!-- 10 -->
    <rect x="780" y="905" width="480" height="70" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="795" y="933" font-weight="600" fill="#7c2d12">On close: transcript saved → Handoff Quality score</text>
    <text x="795" y="958" font-size="15" fill="#9a3412">re-asked facts · generic opener · "I already told the bot"</text>
  </g>
</svg>
